# Used by app/sched_update_file_org/generate_schedules.py to build the
# baseline/schedule ID/schedule name nomenclature lookup for a data date.
# Key = schedule/baseline ID prefix (IDs become "<key>.<filename_date>" and
# "<key>-<filename_date>"). Value = schedule name template, supporting
